name: Phase 02 Capability Apply

on:
  push:
    branches:
      - gsd/phase-02-design-capability
    paths:
      - '.github/workflows/phase-02-capability-plan.yml'
      - '.planning/workbench/phase-02/**'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install planning dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Apply exact approved capability plan
        shell: bash
        run: |
          set -euo pipefail
          python skills/skill-publish/scripts/catalog_capability.py \
            apply \
            --spec .planning/workbench/phase-02/capability.json \
            --approve 20211512207f8eb5f6981394270ae59489707848317337b88f5d0925449bcede \
            | tee /tmp/phase-02-capability-apply.json

          echo '--- generated status ---'
          git status --short
          echo '--- distribution.config.json ---'
          cat plugins/design-engineering/distribution.config.json
          echo '--- SKILL.md ---'
          cat plugins/design-engineering/skills/design-engineering/SKILL.md
          echo '--- plugin.json ---'
          cat plugins/design-engineering/plugin.json
          echo '--- marketplace.json ---'
          cat marketplace.json
          echo '--- .agents/plugins/marketplace.json ---'
          cat .agents/plugins/marketplace.json
