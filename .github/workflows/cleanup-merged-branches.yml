name: Cleanup merged branches

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete same-repository branches from merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          default_branch="${{ github.event.repository.default_branch }}"

          gh api "repos/$repo/pulls?state=closed&per_page=100&sort=updated&direction=desc" \
            --jq '.[] | select(.merged_at != null) | [.head.repo.full_name, .head.ref] | @tsv' \
            | while IFS=$'\t' read -r head_repo branch; do
                [ "$head_repo" = "$repo" ] || continue
                [ "$branch" != "$default_branch" ] || continue

                if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
                  echo "Deleting merged branch: $branch"
                  gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
                fi
              done
