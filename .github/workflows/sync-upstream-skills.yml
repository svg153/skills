name: Sync upstream skills

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  github-build-or-reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync GitHub Build or Reuse
        run: ./scripts/sync-upstream-skill.sh github-build-or-reuse
      - name: Commit upstream changes
        run: |
          if git diff --quiet -- skills/github-build-or-reuse; then
            echo "No upstream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/github-build-or-reuse
          git commit -m "chore(skills): sync github-build-or-reuse upstream"
          git push
