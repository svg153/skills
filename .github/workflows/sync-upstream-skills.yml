name: Sync upstream skills

on:
  workflow_dispatch:
  schedule:
    # Run daily; each skill's metadata interval decides whether it is due.
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync due upstream skills
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./scripts/sync-upstreams.sh --all
          else
            ./scripts/sync-upstreams.sh --due
          fi

      - name: Commit upstream changes
        shell: bash
        run: |
          if git diff --quiet -- skills/; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/
          git commit -m "chore(skills): sync managed upstream skills"
          git push
