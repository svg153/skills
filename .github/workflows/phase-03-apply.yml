name: Phase 03 Apply

on:
  push:
    branches:
      - gsd/phase-03-external-components
    paths:
      - '.github/workflows/phase-03-apply.yml'
      - 'scripts/phase03_apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install test dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Apply Phase 03 patch
        run: python scripts/phase03_apply.py

      - name: Run capability tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_capability_plugins.py' -v
          python -m unittest discover -s tests -p 'test_skill_publish_capability.py' -v
          python scripts/generate-capability-plugin.py --all --check
          python scripts/generate-distribution.py --check
          git diff --check

      - name: Commit validated Phase 03 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'svg153'
          git config user.email 'svg153@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add APM-locked capability external components'
          git push origin HEAD:gsd/phase-03-external-components
