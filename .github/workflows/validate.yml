name: Skills Validation

on:
  push:
    paths:
      - 'skills/**/metadata.yaml'
      - 'skills/**/SKILL.md'
      - 'skills/**/apm.yml'
      - 'skills.sh.json'
      - 'distribution.config.json'
      - 'plugin.json'
      - 'marketplace.json'
      - '.agents/**'
      - '.codex-plugin/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - 'gemini-extension.json'
      - 'scripts/**'
      - 'integrations/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths:
      - 'skills/**/metadata.yaml'
      - 'skills/**/SKILL.md'
      - 'skills/**/apm.yml'
      - 'skills.sh.json'
      - 'distribution.config.json'
      - 'plugin.json'
      - 'marketplace.json'
      - '.agents/**'
      - '.codex-plugin/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - 'gemini-extension.json'
      - 'scripts/**'
      - 'integrations/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML>=6,<7'

      - name: Validate workflow security baseline
        run: python scripts/validate-workflow-security.py

      - name: Validate Agent Skill frontmatter
        run: python scripts/validate-skills.py

      - name: Validate metadata lifecycle
        run: |
          python scripts/validate-metadata-lifecycle.py
          python skills/skill-publish/scripts/metadata_repair.py check

      - name: Validate generated cross-agent manifests
        run: python scripts/generate-distribution.py --check

      - name: Check duplicate catalog names
        shell: bash
        run: |
          set -euo pipefail
          names=$(for meta in skills/*/metadata.yaml; do grep '^name:' "$meta" 2>/dev/null; done | sort)
          duplicates=$(echo "$names" | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "ERROR: duplicate catalog names found:"
            echo "$duplicates"
            exit 1
          fi
          echo "OK: no duplicate catalog names"

      - name: Validate skills.sh configuration
        run: python -m json.tool skills.sh.json >/dev/null

      - name: Validate npx skills discovery
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          npx -y skills@latest add . --list 2>&1 | tee /tmp/skills-list.txt
          if grep -q 'Skipped .*SKILL.md' /tmp/skills-list.txt; then
            echo "ERROR: npx skills skipped one or more catalog entries"
            exit 1
          fi
          grep -q 'github-build-or-reuse' /tmp/skills-list.txt
          grep -q 'social-publishing' /tmp/skills-list.txt
          grep -q 'gentle-ai-ecosystem' /tmp/skills-list.txt
          echo "OK: npx skills discovers expected catalog entries without parser skips"

      - name: Validate APM skill consumption
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'apm-cli>=0.28,<0.30'
          source_dir="$GITHUB_WORKSPACE/skills/social-publishing"
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          cat > apm.yml <<'YAML'
          name: apm-consumer-smoke-test
          version: "1.0.0"
          targets:
            - agent-skills
          dependencies:
            apm: []
            mcp: []
          YAML
          apm install "$source_dir" --target agent-skills --verbose
          test -f .agents/skills/social-publishing/SKILL.md
          grep -q '^name: social-publishing$' .agents/skills/social-publishing/SKILL.md
          test -f apm.lock.yaml
          echo "OK: APM consumes social-publishing as a single-skill bundle"

      - name: Validate generic upstream selector
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/sync-upstreams.sh --list

      - name: Summary
        shell: bash
        run: |
          total=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Skills library: $total entries validated"
