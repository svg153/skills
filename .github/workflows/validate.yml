name: Skills Validation

on:
  push:
    paths:
      - 'skills/**/metadata.yaml'
      - 'skills/**/SKILL.md'
      - 'skills/**/apm.yml'
      - 'skills.sh.json'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
    paths:
      - 'skills/**/metadata.yaml'
      - 'skills/**/SKILL.md'
      - 'skills/**/apm.yml'
      - 'skills.sh.json'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata.yaml
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating all metadata.yaml files..."

          read_sync_field() {
            local meta="$1"
            local field="$2"
            awk -v field="$field" '
              /^sync:/ { in_sync=1; next }
              in_sync && /^[^ ]/ { in_sync=0 }
              in_sync && $1 == field ":" { print $2; exit }
            ' "$meta"
          }

          for meta in skills/*/metadata.yaml; do
            [ -f "$meta" ] || continue

            name=$(grep '^name:' "$meta" | sed 's/^name: *//')
            origin=$(grep '^origin:' "$meta" | sed 's/^origin: *//')
            category=$(grep '^category:' "$meta" | sed 's/^category: *//')
            strategy=$(read_sync_field "$meta" strategy)
            authoritative=$(read_sync_field "$meta" authoritative)
            enabled=$(read_sync_field "$meta" enabled)

            [ -n "$name" ] || { echo "ERROR: $meta missing name"; exit 1; }
            [ -n "$origin" ] || { echo "ERROR: $meta missing origin"; exit 1; }
            [ -n "$category" ] || { echo "ERROR: $meta missing category"; exit 1; }

            if [ "${strategy:-manual}" = "download" ]; then
              [ "${enabled:-false}" = "true" ] || { echo "ERROR: $meta download sync must be enabled"; exit 1; }
              [ "${authoritative:-}" = "upstream" ] || { echo "ERROR: $meta download sync must be authoritative: upstream"; exit 1; }
              grep -q '^origin_path:' "$meta" || { echo "ERROR: $meta download sync needs origin_path"; exit 1; }
            fi

            echo "OK: $(dirname "$meta" | xargs basename): $origin (${strategy:-manual})"
          done

      - name: Validate SKILL.md exists
        shell: bash
        run: |
          set -euo pipefail
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            [ -f "$skill_dir/SKILL.md" ] || { echo "ERROR: $skill_name missing SKILL.md"; exit 1; }
          done
          echo "OK: all catalog entries have SKILL.md"

      - name: Check duplicate skill names
        shell: bash
        run: |
          set -euo pipefail
          names=$(for meta in skills/*/metadata.yaml; do grep '^name:' "$meta" 2>/dev/null; done | sort)
          duplicates=$(echo "$names" | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "ERROR: duplicate skill names found:"
            echo "$duplicates"
            exit 1
          fi
          echo "OK: no duplicate catalog names"

      - name: Validate skills.sh configuration
        run: python -m json.tool skills.sh.json >/dev/null

      - name: Validate npx skills discovery
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          npx -y skills@latest add . --list | tee /tmp/skills-list.txt
          grep -q 'github-build-or-reuse' /tmp/skills-list.txt
          grep -q 'social-publishing' /tmp/skills-list.txt
          echo "OK: npx skills discovers expected catalog entries"

      - name: Validate APM package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'apm-cli>=0.28,<0.30'
          (
            cd skills/social-publishing
            apm compile --validate
            apm pack --dry-run --verbose
          )
          echo "OK: social-publishing is a valid standalone APM package"

      - name: Validate generic upstream selector
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/sync-upstreams.sh --list

      - name: Summary
        shell: bash
        run: |
          total=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Skills library: $total entries validated"
