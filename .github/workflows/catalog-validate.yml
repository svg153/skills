name: Catalog Validation

on:
  push:
    paths:
      - 'skills/**'
      - 'skills.sh.json'
      - 'scripts/generate-catalog.py'
      - '.github/workflows/catalog-validate.yml'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'skills.sh.json'
      - 'scripts/generate-catalog.py'
      - '.github/workflows/catalog-validate.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install catalog dependencies
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Validate generated catalog
        run: python scripts/generate-catalog.py --check
