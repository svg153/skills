name: APM external skills

on:
  pull_request:
    paths:
      - 'dependencies/external-skills/**'
      - 'renovate.json'
      - '.github/workflows/apm-external-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned APM CLI
        shell: bash
        env:
          APM_VERSION: '0.29.1'
          APM_ARCHIVE_SHA256: 'a8530bc9d15a7b4a7a8334e4a8b4ac27b3652bcbd8ccbfc58571903b43686644'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apm-linux-x86_64.tar.gz"
          extracted="$RUNNER_TEMP/apm-extracted"
          bindir="$RUNNER_TEMP/apm-bin"
          mkdir -p "$extracted" "$bindir"

          curl --fail --silent --show-error --location \
            "https://github.com/microsoft/apm/releases/download/v${APM_VERSION}/apm-linux-x86_64.tar.gz" \
            --output "$archive"
          echo "${APM_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$extracted"

          apm_binary=$(find "$extracted" -type f -name apm -print -quit)
          test -n "$apm_binary"
          install -m 0755 "$apm_binary" "$bindir/apm"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Verify APM version
        shell: bash
        run: |
          set -euo pipefail
          apm --version | tee /tmp/apm-version.txt
          grep -q '0.29.1' /tmp/apm-version.txt

      - name: Verify external dependency lock
        working-directory: dependencies/external-skills
        shell: bash
        run: |
          set -euo pipefail
          apm lock

          if [ -n "$(git status --porcelain -- apm.lock.yaml)" ]; then
            echo 'ERROR: apm.lock.yaml is missing or stale.'
            echo '--- APM_LOCK_START ---'
            cat apm.lock.yaml
            echo '--- APM_LOCK_END ---'
            exit 1
          fi

          apm lock export --format cyclonedx --output /tmp/external-skills-sbom.json
          test -s /tmp/external-skills-sbom.json
          echo 'OK: external Agent Skill dependencies resolve exactly to the committed APM lock'
