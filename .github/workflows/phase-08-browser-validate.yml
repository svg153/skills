name: Phase 08 Browser Validate

on:
  push:
    branches:
      - gsd/phase-08-playwright-loop
    paths:
      - '.github/workflows/phase-08-browser-validate.yml'
      - 'plugins/design-engineering/skills/design-engineering/references/browser-loop.md'
      - 'plugins/design-engineering/skills/design-engineering/references/workflow.md'
      - 'plugins/design-engineering/README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install official Playwright CLI
        run: npm install --global '@playwright/cli@0.1.19'

      - name: Create local browser fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/design-browser-fixture
          cat > /tmp/design-browser-fixture/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Design Evidence Fixture</title>
              <style>
                body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
                main { max-width: 720px; margin: auto; }
                button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
                #status { min-height: 1.5em; }
              </style>
            </head>
            <body>
              <main>
                <h1>Browser evidence fixture</h1>
                <p id="status" aria-live="polite">Ready</p>
                <button id="action" type="button">Run action</button>
              </main>
              <script>
                document.querySelector('#action').addEventListener('click', () => {
                  document.querySelector('#status').textContent = 'Verified interaction';
                });
              </script>
            </body>
          </html>
          HTML
          python -m http.server 4173 --directory /tmp/design-browser-fixture >/tmp/browser-fixture.log 2>&1 &
          echo $! >/tmp/browser-fixture.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/browser-fixture.log
          exit 1

      - name: Exercise rendered evidence path
        shell: bash
        run: |
          set -euo pipefail
          playwright-cli --help >/tmp/playwright-help.txt
          grep -q 'snapshot' /tmp/playwright-help.txt
          grep -q 'screenshot' /tmp/playwright-help.txt
          grep -q 'console' /tmp/playwright-help.txt

          playwright-cli -s=phase08 open http://127.0.0.1:4173
          playwright-cli -s=phase08 snapshot --filename=/tmp/before.yml
          grep -q 'Browser evidence fixture' /tmp/before.yml

          playwright-cli -s=phase08 resize 390 844
          playwright-cli -s=phase08 press Tab
          playwright-cli -s=phase08 press Enter
          playwright-cli -s=phase08 snapshot --filename=/tmp/mobile-after.yml
          grep -q 'Verified interaction' /tmp/mobile-after.yml
          playwright-cli -s=phase08 screenshot --filename=/tmp/mobile-after.png

          playwright-cli -s=phase08 resize 768 1024
          playwright-cli -s=phase08 snapshot --filename=/tmp/tablet.yml
          playwright-cli -s=phase08 resize 1440 900
          playwright-cli -s=phase08 snapshot --filename=/tmp/desktop.yml
          playwright-cli -s=phase08 console >/tmp/console.txt

          test -s /tmp/mobile-after.png
          test -s /tmp/tablet.yml
          test -s /tmp/desktop.yml
          playwright-cli -s=phase08 close

      - name: Validate documentation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('plugins/design-engineering')
          contract = (root / 'skills/design-engineering/references/browser-loop.md').read_text(encoding='utf-8')
          workflow = (root / 'skills/design-engineering/references/workflow.md').read_text(encoding='utf-8')
          readme = (root / 'README.md').read_text(encoding='utf-8')
          checks = {
              'project tooling first': 'Existing project browser/e2e tooling' in contract,
              '390 width': '390 x 844' in contract,
              '768 width': '768 x 1024' in contract,
              '1440 width': '1440 x 900' in contract,
              'focus evidence': 'Keyboard/focus' in contract,
              'console evidence': 'Runtime/console' in contract,
              'three cycle bound': '3 automatic fix -> render cycles' in contract,
              'explicit statuses': '`Verified`, `Blocked`, `Not checked`, and `Not applicable`' in contract,
              'workflow handoff': 'references/browser-loop.md' in workflow,
              'source-only boundary': 'source-validated only' in workflow,
              'no mandatory MCP': 'no mandatory browser MCP' in readme,
          }
          missing = [name for name, passed in checks.items() if not passed]
          if missing:
              raise SystemExit('missing browser contract invariants: ' + ', '.join(missing))
          print('OK: browser evidence contract invariants present')
          PY
