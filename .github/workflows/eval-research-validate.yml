name: Eval Research Validation

on:
  push:
    paths:
      - 'research/evals/**'
      - 'docs/adr/**'
      - 'scripts/validate-eval-research.py'
      - '.github/workflows/eval-research-validate.yml'
  pull_request:
    paths:
      - 'research/evals/**'
      - 'docs/adr/**'
      - 'scripts/validate-eval-research.py'
      - '.github/workflows/eval-research-validate.yml'

permissions:
  contents: read

jobs:
  validate-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Validate workflow security baseline
        run: python scripts/validate-workflow-security.py

      - name: Validate equivalent research scenarios
        run: python scripts/validate-eval-research.py
