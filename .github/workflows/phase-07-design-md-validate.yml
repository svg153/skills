name: Phase 07 DESIGN.md Validate

on:
  push:
    branches:
      - gsd/phase-07-design-md
    paths:
      - '.github/workflows/phase-07-design-md-validate.yml'
      - 'plugins/design-engineering/skills/design-engineering/references/design-md.md'
      - 'plugins/design-engineering/skills/design-engineering/references/DESIGN.md.template'
      - 'plugins/design-engineering/skills/design-engineering/references/workflow.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate template with official DESIGN.md CLI
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/design-engineering/skills/design-engineering/references/DESIGN.md.template /tmp/DESIGN.md
          npx -y -p @google/design.md@0.4.0 designmd lint /tmp/DESIGN.md

      - name: Validate contract invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('plugins/design-engineering/skills/design-engineering/references')
          contract = (base / 'design-md.md').read_text(encoding='utf-8')
          workflow = (base / 'workflow.md').read_text(encoding='utf-8')
          required = {
              'contract: normative tokens': ('Tokens are normative', contract),
              'contract: monorepo precedence': ('nearest-app precedence', contract),
              'contract: inference label': ('Inferred from current UI', contract),
              'contract: one-off exclusion': ('one-off bug fix', contract),
              'contract: no CSS churn': ('Do not rewrite `DESIGN.md` merely because a UI task touched CSS', contract),
              'workflow: template handoff': ('references/DESIGN.md.template', workflow),
              'workflow: app scope precedence': ('A more-specific app design source cannot be silently overridden', workflow),
          }
          missing = [name for name, (needle, haystack) in required.items() if needle not in haystack]
          if missing:
              raise SystemExit('missing invariants: ' + ', '.join(missing))
          print('OK: DESIGN.md contract invariants present')
          PY
