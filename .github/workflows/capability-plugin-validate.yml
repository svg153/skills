name: Capability Plugin Validation

on:
  push:
    paths:
      - 'plugins/**'
      - 'marketplace.json'
      - 'scripts/generate-capability-plugin.py'
      - 'scripts/generate-distribution.py'
      - 'scripts/agent_plugin_mcp.py'
      - 'tests/test_capability_plugins.py'
      - '.github/workflows/capability-plugin-validate.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'marketplace.json'
      - 'scripts/generate-capability-plugin.py'
      - 'scripts/generate-distribution.py'
      - 'scripts/agent_plugin_mcp.py'
      - 'tests/test_capability_plugins.py'
      - '.github/workflows/capability-plugin-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML>=6,<7'

      - name: Validate workflow security baseline
        run: python scripts/validate-workflow-security.py

      - name: Validate root marketplace generation
        run: python scripts/generate-distribution.py --check

      - name: Validate planning package generation
        run: |
          python scripts/generate-capability-plugin.py \
            --config plugins/planning/distribution.config.json \
            --check

      - name: Run capability plugin unit tests
        run: python -m unittest discover -s tests -p 'test_capability_plugins.py' -v

      - name: Validate Agent Skills reference specification
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/agentskills/agentskills.git /tmp/agentskills
          git -C /tmp/agentskills fetch --depth 1 origin 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          git -C /tmp/agentskills checkout 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python -m pip install /tmp/agentskills/skills-ref
          skills-ref validate plugins/planning/skills/planning
          skills-ref validate plugins/planning/skills/backlog-management

      - name: Validate cross-agent skill discovery
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          npx -y skills@latest add ./plugins/planning --list 2>&1 | tee /tmp/planning-skills.txt
          grep -q 'planning' /tmp/planning-skills.txt
          grep -q 'backlog-management' /tmp/planning-skills.txt
          echo 'OK: planning plugin exposes both portable skills'

      - name: Set up Node.js for Copilot CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate GitHub Copilot CLI marketplace, plugin and MCP discovery
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@github/copilot@1.0.83'
          copilot --version

          copilot plugin marketplace add .
          copilot plugin marketplace browse svg153-skills 2>&1 | tee /tmp/copilot-marketplace.txt
          grep -q 'planning' /tmp/copilot-marketplace.txt

          copilot plugin install planning@svg153-skills
          copilot plugin list 2>&1 | tee /tmp/copilot-plugins.txt
          grep -q 'planning' /tmp/copilot-plugins.txt

          copilot mcp list --json > /tmp/copilot-mcps.json
          cat /tmp/copilot-mcps.json
          grep -q '"github"' /tmp/copilot-mcps.json
          grep -q '"atlassian"' /tmp/copilot-mcps.json
          grep -q '"sourcePlugin": "planning"' /tmp/copilot-mcps.json

          echo 'OK: Copilot CLI marketplace installed planning and discovered both plugin-provided MCP servers'
