name: Trusted Behavioral Skill Evaluations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

# GitHub Copilot SDK supports the built-in Actions token for organization-owned
# repositories when the organization enables Copilot CLI billing/policy. Personal
# repositories fall back to an optional user token exposed as COPILOT_GITHUB_TOKEN.
permissions:
  contents: read
  copilot-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WAZA_NO_UPDATE_CHECK: '1'
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Detect supported Copilot authentication
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=user-token" >> "$GITHUB_OUTPUT"
            echo "OK: using explicit COPILOT_GITHUB_TOKEN for trusted Waza execution"
          elif [[ "${REPOSITORY_OWNER_TYPE:-}" == "Organization" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=actions-token" >> "$GITHUB_OUTPUT"
            echo "OK: using built-in GITHUB_TOKEN with copilot-requests: write"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::This user-owned repository has no COPILOT_GITHUB_TOKEN; model-backed evals were skipped. Configure a Copilot-compatible user token, or move the workflow to an organization-owned repository with Copilot Actions billing/policy enabled."
          fi

      - name: Install pinned Waza
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-waza-ci.sh "$RUNNER_TEMP/waza"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run behavioral suites
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -uo pipefail
          status=0
          echo "Copilot auth mode: ${{ steps.credentials.outputs.mode }}"
          while IFS= read -r eval_file; do
            skill="$(basename "$(dirname "$eval_file")")"
            output_dir="eval-results/${skill}"
            mkdir -p "$output_dir/transcripts"
            echo "Evaluating ${skill}"
            if ! waza run "$eval_file" \
              --output "$output_dir/results.json" \
              --reporter "junit:$output_dir/junit.xml" \
              --transcript-dir "$output_dir/transcripts"; then
              status=1
            fi
          done < <(find evals -mindepth 2 -maxdepth 2 -name eval.yaml -print | sort)
          exit "$status"

      - name: Upload behavioral evidence
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: waza-behavioral-results-${{ github.run_id }}
          path: eval-results/
          if-no-files-found: warn
          retention-days: 14
