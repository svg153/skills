name: Behavioral Eval Static Validation

on:
  push:
    paths:
      - 'evals/**'
      - 'skills/**/SKILL.md'
      - 'skills/**/metadata.yaml'
      - 'plugins/**/skills/**/SKILL.md'
      - 'plugins/**/plugin.json'
      - 'plugins/**/distribution.config.json'
      - 'scripts/validate-evals.py'
      - 'scripts/install-waza-ci.sh'
      - 'docs/evals.md'
      - '.github/workflows/eval-static.yml'
      - '.github/workflows/eval-behavioral.yml'
  pull_request:
    paths:
      - 'evals/**'
      - 'skills/**/SKILL.md'
      - 'skills/**/metadata.yaml'
      - 'plugins/**/skills/**/SKILL.md'
      - 'plugins/**/plugin.json'
      - 'plugins/**/distribution.config.json'
      - 'scripts/validate-evals.py'
      - 'scripts/install-waza-ci.sh'
      - 'docs/evals.md'
      - '.github/workflows/eval-static.yml'
      - '.github/workflows/eval-behavioral.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAZA_NO_UPDATE_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install YAML validation dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Validate catalog behavioral eval contract
        run: python scripts/validate-evals.py

      - name: Install pinned Waza
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-waza-ci.sh "$RUNNER_TEMP/waza"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify Waza specs without model calls
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r eval_file; do
            skill="$(basename "$(dirname "$eval_file")")"
            skill_dir="$(python scripts/validate-evals.py --resolve-skill-dir "$skill")"
            echo "Verifying ${skill} from ${skill_dir}"
            waza spec verify \
              --skill "$skill_dir" \
              --eval "$eval_file" \
              --format github-actions
          done < <(find evals -mindepth 2 -maxdepth 2 -name eval.yaml -print | sort)

      - name: Preflight evals without model calls
        shell: bash
        run: |
          set -uo pipefail
          # `waza preflight` starts no agent or model. Waza loads a task with unknown fields
          # as a warning and ignores them (a grader nested under `expected:` never ran), so
          # fail on that warning and on an invalid task. The exit code is deliberately not
          # used: preflight also requires config.model, which only the routing suite sets.
          status=0
          while IFS= read -r eval_file; do
            out="$(waza preflight "$eval_file" --no-update-check 2>&1)" || true
            if grep -E 'unknown schema field ignored|^invalid task\.schema' <<<"$out"; then
              echo "::error file=${eval_file}::waza preflight reports an ignored or invalid task field"
              status=1
            fi
          done < <(find evals -mindepth 2 -maxdepth 2 -name eval.yaml -print | sort)
          exit "$status"
