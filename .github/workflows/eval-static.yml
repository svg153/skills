name: Behavioral Eval Static Validation

on:
  push:
    paths:
      - 'evals/**'
      - 'skills/**/SKILL.md'
      - 'skills/**/metadata.yaml'
      - 'scripts/validate-evals.py'
      - 'scripts/install-waza-ci.sh'
      - 'docs/evals.md'
      - '.github/workflows/eval-static.yml'
      - '.github/workflows/eval-behavioral.yml'
  pull_request:
    paths:
      - 'evals/**'
      - 'skills/**/SKILL.md'
      - 'skills/**/metadata.yaml'
      - 'scripts/validate-evals.py'
      - 'scripts/install-waza-ci.sh'
      - 'docs/evals.md'
      - '.github/workflows/eval-static.yml'
      - '.github/workflows/eval-behavioral.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAZA_NO_UPDATE_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install YAML validation dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Validate catalog behavioral eval contract
        run: python scripts/validate-evals.py

      - name: Install pinned Waza
        shell: bash
        run: |
          set -euo pipefail
          scripts/install-waza-ci.sh "$RUNNER_TEMP/waza"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify Waza specs without model calls
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r eval_file; do
            skill="$(basename "$(dirname "$eval_file")")"
            echo "Verifying ${skill}"
            waza spec verify \
              --skill "skills/${skill}" \
              --eval "$eval_file" \
              --format github-actions
          done < <(find evals -mindepth 2 -maxdepth 2 -name eval.yaml -print | sort)
