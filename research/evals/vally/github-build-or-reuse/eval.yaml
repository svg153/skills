name: github-build-or-reuse-prototype
description: >-
  Equivalent Vally research prototype for the github-build-or-reuse scenario contract.
type: capability

defaults:
  runs: 1
  timeout: 5m
  executor: copilot-sdk

environment:
  skills:
    - ../../../../skills/github-build-or-reuse

scoring:
  weights:
    output-matches: 0.35
    prompt: 0.65
  threshold: 0.75

stimuli:
  - name: nontrivial-build-research-first
    prompt: >-
      Build me a self-hosted AI presentation generator that exports editable PPTX files.
      Start implementing it now.
    rubric:
      - Research credible open-source/GitHub alternatives before substantial implementation.
      - Converge on one primary USE, CONTRIBUTE, FORK, or BUILD verdict.
    graders:
      - type: output-matches
        name: decision-vocabulary
        config:
          pattern: "\\b(USE|CONTRIBUTE|FORK|BUILD)\\b"
      - type: prompt
        name: research-before-build
        config:
          prompt: >-
            Did the response perform or explicitly attempt repository/open-source due diligence
            before substantial implementation rather than jumping straight into code?

  - name: compare-open-source-alternatives
    prompt: >-
      Compare open-source GitHub projects I could reuse for browser automation in a service,
      then tell me whether I should adopt one, contribute, fork, or build my own.
    rubric:
      - Compare plausible candidates using consequential evidence, not stars alone.
      - Return one primary reuse verdict.
    graders:
      - type: output-matches
        name: decision-vocabulary
        config:
          pattern: "\\b(USE|CONTRIBUTE|FORK|BUILD)\\b"
      - type: prompt
        name: evidence-based-comparison
        config:
          prompt: >-
            Did the response use fit plus consequential evidence such as license, maintenance,
            security or governance instead of treating popularity as the adoption decision?

  - name: trivial-snippet-boundary
    prompt: >-
      Write a tiny Python function that returns True when an integer is even.
    rubric:
      - Do not force a disproportionate repository discovery cycle for this trivial snippet.
    graders:
      - type: prompt
        name: boundary
        config:
          prompt: >-
            Did the response avoid forcing a full GitHub/open-source discovery workflow for this
            tiny mechanical implementation request?

  - name: explicit-discovery-bypass
    prompt: >-
      I know alternatives may exist, but explicitly skip GitHub/open-source discovery for this
      feature and just help me implement my chosen design.
    rubric:
      - Honor the explicit bypass and disclose that reuse vetting was skipped.
    graders:
      - type: prompt
        name: bypass-disclosed
        config:
          prompt: >-
            Did the response honor the explicit bypass and clearly state that repository reuse
            vetting was intentionally skipped, without pretending that due diligence occurred?

  - name: unavailable-search-disclosure
    prompt: >-
      Decide whether I should reuse an existing open-source notification service or build one,
      but assume GitHub API, gh and web search are unavailable in this environment.
    rubric:
      - Disclose unavailable evidence and lower confidence rather than fabricating due diligence.
    graders:
      - type: prompt
        name: evidence-gap-disclosed
        config:
          prompt: >-
            Did the response explicitly disclose that live repository evidence could not be
            verified and avoid inventing current repository facts?
