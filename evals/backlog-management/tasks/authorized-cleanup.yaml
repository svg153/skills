id: backlog-authorized-cleanup
name: Authorized backlog cleanup reads first and makes the smallest useful changes
inputs:
  prompt: >-
    Review our existing GitHub and Jira backlog, remove duplicate planning noise, fix the important
    dependency links and update the affected tickets. Keep Jira as the source of truth for program
    work and GitHub as the source of truth for repository implementation. You can make the scoped
    backlog changes I asked for.
expected:
  should_trigger: true
  graders:
    - type: trigger
      name: activation
      config:
        skill_path: plugins/planning/skills/backlog-management/SKILL.md
        mode: positive
        threshold: 0.6
    - type: prompt
      name: safe_cleanup
      config:
        prompt: >-
          Pass only if the response reads current provider state before material updates, prefers
          editing/linking existing records over ticket replacement, preserves Jira versus GitHub
          authority boundaries, treats the request as sufficient scoped mutation authorization
          without asking again per ticket, and uses provider-confirmed IDs rather than guessed
          titles when describing successful writes.
