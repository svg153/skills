name: github-build-or-reuse-catalog-routing
description: >-
  Catalog-owned integration suite for routing github-build-or-reuse among overlapping skills.
skill: github-build-or-reuse
schemaVersion: "1.2"
version: "1.1"

config:
  trials_per_task: 1
  # Routing-class suite (docs/evals.md): cheapest suitable model and a tight per-task
  # timeout, because the previous default-model run did 2-3 minutes of live research
  # per task (34 premium requests for 3 tasks). Waza 0.38.6 has no max-turns setting;
  # the timeout is the only hard cap.
  timeout_seconds: 150
  parallel: false
  executor: copilot-sdk
  model: claude-haiku-4.5
  inject_skill_body: false

metrics:
  - name: trigger_accuracy
    weight: 0.55
    threshold: 0.8
  - name: behavior_quality
    weight: 0.25
    threshold: 0.7
  - name: task_completion
    weight: 0.20
    threshold: 0.7

tasks:
  - "tasks/*.yaml"
