name: github-build-or-reuse-catalog-routing
description: >-
  Catalog-owned integration suite for routing github-build-or-reuse among overlapping skills.
skill: github-build-or-reuse
schemaVersion: "1.2"
version: "1.1"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  inject_skill_body: false

metrics:
  - name: trigger_accuracy
    weight: 0.55
    threshold: 0.8
  - name: behavior_quality
    weight: 0.25
    threshold: 0.7
  - name: task_completion
    weight: 0.20
    threshold: 0.7

tasks:
  - "tasks/*.yaml"
