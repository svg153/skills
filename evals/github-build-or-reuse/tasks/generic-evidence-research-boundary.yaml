id: generic-evidence-research-boundary
name: Generic evidence research does not activate the build/reuse gate
inputs:
  prompt: >-
    Research whether GitHub Actions OIDC capabilities changed during 2026. Use primary sources,
    distinguish confirmed facts from uncertainty, and summarize the evidence. I am not deciding
    whether to build, adopt, fork, or replace any software.
expected:
  should_trigger: false
  graders:
    - type: trigger
      name: generic_research_boundary
      config:
        skill_path: skills/github-build-or-reuse/SKILL.md
        mode: negative
        threshold: 0.6
