id: svg153-writing-close-message
name: close message
inputs:
  prompt: 'Ordéname este mensaje para copiar y pegar en WhatsApp a un colega, como
    si hablara yo. Mi muestra para él: "Hola! Una duda, ¿podemos hacerlo online? Si
    no, lo comentamos después jaja". Borrador: "pues quería preguntarte si al final
    hacemos la sesión online o nos esperamos a tener fecha presencial".'
expected:
  should_trigger: true
  graders:
  - type: trigger
    name: activation
    config:
      skill_path: skills/svg153-writing-style/SKILL.md
      mode: positive
      threshold: 0.6
  - type: prompt
    name: context_and_fidelity
    config:
      prompt: 'Pass only if: Return a brief Spanish close-contact message with a clear
        question and both alternatives. Keep natural warmth without forced marketing,
        excessive emojis or a long essay. Do not invent dates or commitments.'
