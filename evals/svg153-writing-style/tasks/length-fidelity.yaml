id: svg153-writing-length-fidelity
name: length fidelity
inputs:
  prompt: 'Para copiar y pegar en WhatsApp, máximo 180 caracteres. Mi estilo: "Hola!
    Una duda, ¿podemos hacerlo online? Si no, lo comentamos después". Pide que confirmen
    si la reunión será online o presencial antes de fijar fecha. No prometas asistir.'
expected:
  should_trigger: true
  graders:
  - type: trigger
    name: activation
    config:
      skill_path: skills/svg153-writing-style/SKILL.md
      mode: positive
      threshold: 0.6
  - type: prompt
    name: context_and_fidelity
    config:
      prompt: 'Pass only if: The ready-to-paste draft is at most 180 characters, has
        a clear format question and requests clarification before setting a date.
        No attendance commitment, irrelevant details, forced emojis or em dashes.
        Any explanation stays outside the draft.'
