id: imagen-a-slide-positive
name: imagen-a-slide activates for rebuilding slide images as editable slides
inputs:
  prompt: 'Te paso dos capturas de diapositivas que solo tengo como imagen. Hazme
    un pptx editable de cada una con el mismo diseño, y la portada con la foto de
    fondo limpia y los textos editables encima.'
expected:
  should_trigger: true
  graders:
  - type: trigger
    name: activation
    config:
      skill_path: skills/imagen-a-slide/SKILL.md
      mode: positive
      threshold: 0.6
  - type: prompt
    name: behavior_contract
    config:
      prompt: 'Pass only if the response classifies each slide as native or hybrid,
        uses a clean background plate (texts and company logos removed) for the photo
        cover instead of cropping it, writes a JSON spec rendered by the engine rather
        than hand-written PowerPoint code, never closes the user''s PowerPoint, and
        delivers one editable file per slide.'
