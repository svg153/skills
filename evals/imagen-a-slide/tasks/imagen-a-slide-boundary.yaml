id: imagen-a-slide-boundary
name: imagen-a-slide stays out of from-scratch deck creation
inputs:
  prompt: Create a brand-new five-slide presentation about our quarterly roadmap;
    there are no existing slides or images to start from.
expected:
  should_trigger: false
  graders:
  - type: trigger
    name: boundary
    config:
      skill_path: skills/imagen-a-slide/SKILL.md
      mode: negative
      threshold: 0.6
