id: google-workspace-quality-boundary
name: google-workspace-quality stays out of a local Markdown task
inputs:
  prompt: 'Create a README.md for the local code repository. Keep it as plain Markdown and do not create or edit any Google Drive document.'
expected:
  should_trigger: false
  graders:
  - type: trigger
    name: boundary
    config:
      skill_path: skills/google-workspace-quality/SKILL.md
      mode: negative
      threshold: 0.6
