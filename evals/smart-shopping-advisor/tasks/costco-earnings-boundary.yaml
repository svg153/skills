id: shopping-costco-earnings-boundary
name: Costco corporate or stock analysis is not a shopping decision
inputs:
  prompt: >-
    Summarize Costco's latest quarterly earnings and explain how the Instacart same-day
    partnership affects its stock valuation.
expected:
  should_trigger: false
  graders:
    - type: trigger
      name: boundary
      config:
        skill_path: skills/smart-shopping-advisor/SKILL.md
        mode: negative
        threshold: 0.6
