id: autopilot-git-concept-boundary
name: A generic Git concept question is outside repository autopilot
inputs:
  prompt: >-
    Explain what git rebase does and give me a small example.
expected:
  should_trigger: false
  graders:
    - type: trigger
      name: boundary
      config:
        skill_path: skills/github-repo-autopilot/SKILL.md
        mode: negative
        threshold: 0.6
