id: autopilot-personal-mode-boundary
name: Generic Autopilot stays inactive when Personal delivery owns the loop
inputs:
  prompt: >-
    Personal delivery is already selected: use $personal-agentic-delivery to continue this small-team
    application roadmap with concept-level PRs. Do not run another repository-maintenance loop or switch
    to enterprise delivery.
expected:
  should_trigger: false
  graders:
    - type: trigger
      name: activation
      config:
        skill_path: skills/github-repo-autopilot/SKILL.md
        mode: negative
        threshold: 0.6
