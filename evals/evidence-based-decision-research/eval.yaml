name: evidence-based-decision-research-behavioral
description: >-
  Catalog-owned behavioral evaluation suite for evidence-based-decision-research.
skill: evidence-based-decision-research
schemaVersion: "1.2"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  inject_skill_body: false

metrics:
  - name: trigger_accuracy
    weight: 0.45
    threshold: 0.8
  - name: behavior_quality
    weight: 0.35
    threshold: 0.7
  - name: task_completion
    weight: 0.20
    threshold: 0.7

tasks:
  - "tasks/*.yaml"
