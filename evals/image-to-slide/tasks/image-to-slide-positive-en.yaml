id: image-to-slide-positive-en
name: 'image-to-slide activates for an English request and replies in English'
inputs:
  prompt: 'Rebuild this slide image as an editable pptx with the same design, and also give me a single-file HTML version (both outputs).'
expected:
  should_trigger: true
  graders:
  - type: trigger
    name: activation
    config:
      skill_path: plugins/image-to-slide/skills/image-to-slide/SKILL.md
      mode: positive
      threshold: 0.6
  - type: prompt
    name: behavior_contract
    config:
      prompt: 'Pass only if the response replies in English, chooses both outputs from
        one shared JSON spec (pptx engine and HTML engine), never hand-writes PowerPoint
        or HTML code, never closes the user''s PowerPoint, and does not write notes or
        learnings into the skill''s own folder.'
